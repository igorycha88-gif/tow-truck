# Grafana base configuration (см. ADR-001, ЧТЗ_Графана_Бизнес_метрики.md).
# Доступ через подпуть /grafana за Nginx reverse proxy.
# APP_URL / креды переопределяются через env GF_* в docker-compose.

[server]
http_port = 3000
# Заменяется через GF_SERVER_ROOT_URL в docker-compose (dev/prod различаются).
# serve_from_sub_path=true позволяет шаблоны по подпути /grafana.
serve_from_sub_path = true

[security]
admin_user = admin
disable_gravatar = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer

[panels]
disable_sanitize_html = true

[log]
mode = console
level = info

[metrics]
enabled = true
basic_auth_username = metrics
basic_auth_password = metrics