# Provisioning dashboards: автоматически подхватывает JSON-дашборды из каталога.
# См. grafana/dashboards/business-metrics.json (ADR-001).

apiVersion: 1

providers:
  - name: 'Business Metrics'
    orgId: 1
    folder: '' # default folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false