# CI — шлюз качества проекта «Эвакуация».
# Запускается на push (main/dev) и на PR в main.
# Этапы: install → lint → typecheck → unit-тесты → production-сборка.
# PFAIL → блокирует merge и последующий docker-publish.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Отменяем устаревшие запуски того же воркфлоу на одном бранче.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    env:
      # CI не ходит в БД/Redis (тесты мокают зависимости), но переменные нужны для сборки.
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/tow_truck?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      NEXT_PUBLIC_SITE_URL: 'https://эвакуация.online'
      NEXT_PUBLIC_SITE_NAME: 'Эвакуация Москва и МО'
      NEXT_PUBLIC_PHONE: '+7 (901) 705-45-40'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
