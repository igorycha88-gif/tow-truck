# deploy — ручной Blue-Green деплой «Эвакуация» на VPS (PIPELINE_PROD.js).
#
# Авто-деплой после сборки реализован ВНУТРИ docker-publish.yml (job deploy),
# т.к. дефолтная ветка репозитория — dev, и workflow_run здесь не регистрируется.
# Этот воркфлоу — для ручного ре-деплоя конкретного тега образа.
#
# Запуск: Actions → deploy → Run workflow → тег образа (по умолчанию latest).
name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег образа (по умолчанию latest)'
        required: false
        default: 'latest'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/igorycha88-gif/tow-truck/app:${{ github.event.inputs.image_tag }}
      PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/root/tow-truck' }}
    steps:
      - name: Preflight — VPS-secrets
        run: |
          echo "Image: ${IMAGE}"
          [ -n "${{ secrets.VPS_HOST }}" ] && echo "VPS_HOST: set" || { echo "❌ Secret VPS_HOST не задан"; exit 1; }
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] && echo "VPS_SSH_KEY: set" || { echo "❌ Secret VPS_SSH_KEY не задан"; exit 1; }

      - uses: actions/checkout@v4

      - name: Deploy over SSH (Blue-Green)
        uses: appleboy/ssh-action@v1
        env:
          PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR || '/root/tow-truck' }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          envs: PROJECT_DIR,IMAGE
          script_stop: true
          script: |
            set -euo pipefail
            cd "${PROJECT_DIR}"
            echo "→ Синхронизация кода с origin/main..."
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            echo "→ Запуск Blue-Green деплоя: ${IMAGE}"
            ./deploy/blue-green-deploy.sh "${IMAGE}"

      - name: Verify production health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "→ /api/health (prod 3001):"
            curl -sf --max-time 10 http://127.0.0.1:3001/api/health && echo
            echo "→ Контейнер:"
            docker ps --filter "name=tow-truck-app" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

      - name: Summary
        if: always()
        run: |
          echo "## 🚀 Прод-деплой" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Результат: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
