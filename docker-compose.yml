# Production-окружение для VPS (PIPELINE_PROD.js / SKILL_DEVOPS_PROD.md).
#
# Содержит ТОЛЬКО stateful-сервисы (PostgreSQL + Redis): по Правилу PR5 они НЕ
# пересобираются при каждом деплое. Само приложение (Next.js) деплоится отдельным
# скриптом Blue-Green (deploy/blue-green-deploy.sh) через `docker run --network host`.
#
# Запуск (на VPS, из PROJECT_DIR = /root/tow-truck):
#   docker compose -f docker-compose.yml up -d
#
# Параметры берутся из .env (рядом с этим файлом). См. .env.example.
# Безопасность: порты БД/Redis публикуются ТОЛЬКО на 127.0.0.1 (доступны приложению
# через host-сеть, не торчат в интернет).

name: evakuaciya-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: tow-truck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tow_truck}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tow_truck}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  redis:
    image: redis:7-alpine
    container_name: tow-truck-redis
    restart: unless-stopped
    # Если задан REDIS_PASSWORD — требуем аутентификацию.
    command: >
      sh -c '[ -n "$$REDIS_PASSWORD" ] && redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
      || redis-server --save 60 1 --loglevel warning'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      # Если задан REDIS_PASSWORD — аутентифицируемся; иначе просто ping.
      test: ['CMD-SHELL', 'redis-cli $${REDIS_PASSWORD:+-a $${REDIS_PASSWORD}} ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Бизнес-метрики: Grafana за Nginx подпутем /grafana (см. ADR-001).
  # Nginx проксирует https://эвакуация.online/grafana → 127.0.0.1:3030.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tow-truck-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SERVER_ROOT_URL: https://эвакуация.online/grafana/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GRAFANA_PG_HOST: postgres
      GRAFANA_PG_PORT: '5432'
      GRAFANA_PG_DB: ${POSTGRES_DB:-tow_truck}
      GRAFANA_PG_USER: ${POSTGRES_USER:-postgres}
      GRAFANA_PG_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:3030:3000'
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Метрики PostgreSQL для централизованного мониторинга (ЧТЗ §4.4,
  # TASK-INF-002). Слушает ТОЛЬКО 127.0.0.1:9187 (наружу закрыто,
  # доступ — через nginx /metrics/postgres).
  # Профиль monitoring: сервис НЕ запускается в обычных flow
  # (stateful-сервисы не пересобираются при деплое — Правило PR5).
  # Включение: docker compose --profile monitoring up -d
  postgres-exporter:
    profiles: ['monitoring']
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: tow-truck-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DSN readonly-пользователя (pg_monitor) — только в .env (chmod 600).
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:-}
    ports:
      - '127.0.0.1:9187:9187'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9187/metrics || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '3' }

volumes:
  postgres-data:
  redis-data:
  grafana-data:
