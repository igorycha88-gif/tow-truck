# ─────────────────────────────────────────────────────────────────────
# Nginx server-блоки для домена «эвакуация.online» (production)
# ─────────────────────────────────────────────────────────────────────
# Домен: эвакуация.online  (IDN, Punycode: xn--80akhbyknj4f.online)
# Upstream: см. evakuaciya-upstream.conf (Blue-Green 3001/3003)
# SSL:      Let's Encrypt (см. setup-ssl.sh) — пути см. ниже.
#
# КАК ПРИМЕНИТЬ:
#   1. См. deploy/nginx/README.md — последовательность bootstrap (DNS → nginx → certbot).
#   2. Этот файл = ФИНАЛЬНОЕ состояние ПОСЛЕ выпуска сертификата.
#   3. На первом этапе (до SSL) используется HTTP-only bootstrap из README.
# ─────────────────────────────────────────────────────────────────────

# map $http_upgrade $connection_upgrade вынесен в evakuaciya-map.conf
# (conf.d грузится в http-контексте). gzip и security headers — inline ниже.

# ── HTTP :80 — редирект на HTTPS (apex + www) ───────────────────────
# После выпуска сертификата certbot добавит сюда redirect; здесь явно
# прописан редирект всего трафика (ACME challenge обрабатывается certbot
# автоматически через свой location при renew).
server {
    listen 80;
    listen [::]:80;

    # nginx нормализует IDN; указываем UTF-8 форму.
    server_name эвакуация.online www.эвакуация.online;

    # Let's Encrypt ACME challenge (certbot --nginx добавляет свой location,
    # этот оставляем для надёжности при webroot-режиме).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Всё остальное → HTTPS (апекс, канонический).
    location / {
        return 301 https://эвакуация.online$request_uri;
    }
}

# ── HTTPS :443 — www → apex (канонизация) ───────────────────────────
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    http2 on;

    server_name www.эвакуация.online;

    # Сертификат (общий для apex + www).
    ssl_certificate     /etc/letsencrypt/live/эвакуация.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/эвакуация.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://эвакуация.online$request_uri;
}

# ── HTTPS :443 — apex (основной proxy на upstream app) ──────────────
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    http2 on;

    server_name эвакуация.online;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/эвакуация.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/эвакуация.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Логи (см. SKILL_DEVOPS_PROD.md §АУДИТ).
    access_log /var/log/nginx/evakuaciya-online.access.log;
    error_log  /var/log/nginx/evakuaciya-online.error.log warn;

    # Security headers (дублирует snippet, но явно для этого server).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;

    # gzip (текстовые ответы от Next.js).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Централизованный мониторинг: /metrics/* по ключу X-Monitoring-Key ──
    # (ЧТЗ «Централизованный_мониторинг» §5, TASK-INF-003).
    # Контракт: только GET (иначе 403 от limit_except), без ключа/с неверным
    # ключом → 403 ($metrics_auth из monitoring-key.conf, в git НЕ хранится),
    # rate-limit 10 r/s burst=5, логи — отдельный файл, ключ не логируется.
    # tracking/content → именованный upstream app (переживает Blue-Green,
    # ЧТЗ §5.3); node/postgres → локальные exporter'ы (только 127.0.0.1).
    location ^~ /metrics/tracking {
        limit_except GET { deny all; }
        if ($metrics_auth = 0) { return 403; }
        limit_req zone=metrics_limit burst=5 nodelay;
        access_log /var/log/nginx/evakuaciya-metrics.access.log metrics_min;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /metrics/content {
        limit_except GET { deny all; }
        if ($metrics_auth = 0) { return 403; }
        limit_req zone=metrics_limit burst=5 nodelay;
        access_log /var/log/nginx/evakuaciya-metrics.access.log metrics_min;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /metrics/node {
        limit_except GET { deny all; }
        if ($metrics_auth = 0) { return 403; }
        limit_req zone=metrics_limit burst=5 nodelay;
        access_log /var/log/nginx/evakuaciya-metrics.access.log metrics_min;

        # node_exporter слушает 127.0.0.1:9100 (systemd, deploy/node-exporter/).
        proxy_pass http://127.0.0.1:9100/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /metrics/postgres {
        limit_except GET { deny all; }
        if ($metrics_auth = 0) { return 403; }
        limit_req zone=metrics_limit burst=5 nodelay;
        access_log /var/log/nginx/evakuaciya-metrics.access.log metrics_min;

        # postgres_exporter слушает 127.0.0.1:9187 (docker, deploy/postgres-exporter/).
        proxy_pass http://127.0.0.1:9187/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Reverse proxy на Next.js (upstream app, Blue-Green) ──
    location / {
        proxy_pass http://app;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js: корректные WebSocket/upgrade (HMR,将来 Live).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Grafana под путем /grafana (ADR-001, бизнес-метрики) ──
    # Grafana контейнер публикует 127.0.0.1:3030 → :3000 (см. docker-compose.yml).
    # serve_from_sub_path=true: Grafana сама обрабатывает префикс /grafana.
    location /grafana/ {
        proxy_pass http://127.0.0.1:3030;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── API метрик защищён basic-auth (бизнес-данные, см. ADR-001) ──
    # Фронтенд этот endpoint НЕ использует (Grafana читает PostgreSQL напрямую).
    # Пароль от /api/metrics задаётся через htpasswd (см. deploy/nginx/README.md).
    location = /api/metrics {
        auth_basic "Metrics";
        auth_basic_user_file /etc/nginx/.htpasswd-metrics;

        proxy_pass http://app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэширование статики Next.js (опционально, см. snippet).
    location /_next/static/ {
        proxy_pass http://app;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
