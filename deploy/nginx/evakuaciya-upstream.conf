# ── Blue-Green upstream для «Эвакуация» ────────────────────────────
# PROD (BLUE) по умолчанию слушает 127.0.0.1:3001.
# При деплое (SKILL_DEVOPS_PROD.md) DevOps меняет порт на 3003 (GREEN),
# проверяет healthcheck и переключает обратно на 3001 после cleanup.
#
# Применение на VPS:
#   sudo cp evakuaciya-upstream.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Переключение во время Blue-Green (без правки серверного блока домена):
#   echo "upstream app { server 127.0.0.1:3003; keepalive 32; }" \
#     | sudo tee /etc/nginx/conf.d/evakuaciya-upstream.conf
#   sudo nginx -t && sudo nginx -s reload

upstream app {
    # PROD (BLUE)
    server 127.0.0.1:3001;
    keepalive 32;
}
