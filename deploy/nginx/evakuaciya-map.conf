# ── Map для корректного проброса WebSocket Upgrade на upstream ──────
# Грузится в http-контексте (вместе с остальными /etc/nginx/conf.d/*.conf).
# См. evakuaciya-online.conf → proxy_set_header Connection $connection_upgrade.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Централизованный мониторинг (ЧТЗ «Централизованный мониторинг» §5) ──
# Rate-limit на location'ы /metrics/ — 10 r/s (http-контекст).
limit_req_zone $binary_remote_addr zone=metrics_limit:10m rate=10r/s;

# Минимальный формат доступа к /metrics/: без ключа и лишних заголовков
# (ЧТЗ §5.4 — ключ в логи не попадает).
log_format metrics_min '$remote_addr - $time_iso8601 "$request" $status $body_bytes_sent';
