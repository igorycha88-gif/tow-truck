# ─────────────────────────────────────────────────────────────────────
# Защита от ботов/сканеров: блок UA + rate-limit
# ЧТЗ «Nginx_защита_от_ботов» (2026-09-08), http-контекст.
# ЧТЗ «Метрика_прод_и_WAF_боты» (2026-09-21): явный allow-list ботов
# Яндекса/поисковиков и сервисов мониторинга ПОВЕРХ блок-листа.
# Деплой: scp на VPS → /etc/nginx/conf.d/evakuaciya-protection.conf
# ─────────────────────────────────────────────────────────────────────
# 1) $blocked_agent — 403 для скриптовых/сканирующих User-Agent.
#    nginx map: first-match-wins → allow-правила (0) объявлены РАНЬШЕ
#    блок-паттернов (1) и гарантируют доступ Яндекс-ботам и мониторингу
#    при любых будущих правках блок-листа (риск SEO-падения исключён).
# 2) $rl_key — ключ rate-limit без внутренних IP: пустой ключ = без лимита
#    (healthcheck/Blue-Green/watch ходят с самого VPS).
# 3) Зоны: site_limit 10 r/s (location /), api_limit 5 r/s (location /api/).

map $http_user_agent $blocked_agent {
    default                     0;

    # ── Приоритет 1: боты поисковых систем — ВСЕГДА разрешены (SEO) ──
    # Яндекс: все официальные краулеры содержат «Yandex» (YandexBot,
    # YandexMetrika, YandexWebmaster, YandexDirect, YandexImages, …)
    # либо «YaDirect…» (YaDirectFetcher — верификатор Директа).
    ~*yandex                    0;
    ~*yadirect                  0;
    # Google / Bing / DuckDuckGo / Mail.ru / Apple / Baidu.
    ~*googlebot                 0;
    ~*google-inspectiontool     0;
    ~*bingbot                   0;
    ~*duckduckbot               0;
    ~*mail\.ru_bot              0;
    ~*applebot                  0;
    ~*baiduspider               0;

    # ── Приоритет 2: сервисы мониторинга доступности — разрешены ──
    # uptime* покрывает UptimeRobot/Uptimebot, Uptime-Kuma, BetterUptime.
    ~*uptime                    0;
    ~*checkhost                 0;
    ~*pingdom                   0;
    ~*host-tracker              0;
    ~*statuscake                0;

    # ── Блок-лист: скриптовые/сканирующие UA (защита не ослаблена) ──
    ~*python-httpx              1;
    ~*^httpx/                   1;
    ~*python-requests           1;
    ~*python-urllib             1;
    ~*scrapy                    1;
    ~*go-http-client            1;
    ~*java/                     1;
    ~*apache-httpclient         1;
    ~*okhttp                    1;
    ~*axios/                    1;
    ~*node-fetch                1;
    ~*undici                    1;
    ~*zgrab                     1;
    ~*nuclei                    1;
    ~*masscan                   1;
    ~*nikto                     1;
    ~*sqlmap                    1;
    ~*gobuster                  1;
    ~*dirbuster                 1;
    ~*fscan                     1;
    ~*builtwith                 1;
    ~*exchangescanner           1;
    ~*mj12bot                   1;
    ~*semrushbot                1;
    ~*ahrefsbot                 1;
    ~*dotbot                    1;
    ~*petalbot                  1;
    ~*bytespider                1;
}

# Внутренние IP не лимитируются (127.0.0.1, ::1 и публичный IP VPS).
map $binary_remote_addr $rl_key {
    default          $binary_remote_addr;
    127.0.0.1        "";
    ::1              "";
    178.57.218.204   "";
}

# Общий лимит: 10 r/s на внешний IP (burst 20 применяется в location /).
limit_req_zone $rl_key zone=site_limit:10m rate=10r/s;

# API строже: 5 r/s на внешний IP (burst 10 применяется в location /api/).
limit_req_zone $rl_key zone=api_limit:10m rate=5r/s;

limit_req_status 429;
